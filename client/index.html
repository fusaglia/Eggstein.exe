<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <title>EggStein.exe</title>
    <link rel="stylesheet" href="style/style.css" />
  </head>
  <body>
    <!-- DEBUG -->
    <header><button id="cancUserNameBtn">Cancella userName</button><button id="cancUserIdBtn">Cancella userId</button></header>

    <!-- USER CONNECTED ON MOBILE WARNING (GAME IS ONLY PLAYABLE VIA PC) !!! -->
    <div id="userMobileWarning" class="hidden">
      <h1>EggStein.exe</h1>
      <p>
        Attenzione: per giocare è necessario utilizzare un dispositivo desktop o
        laptop.
      </p>
    </div>

    <!-- USERID ALREADY CONNECTED WARNING !!! -->
    <div id="userIdWarning" class="hidden">
      <h1>EggStein.exe</h1>
      <p>
        Attenzione: questo UserID è già collegato da un'altra scheda o
        dispositivo.
      </p>
    </div>

    <!-- 🟦 LOBBY SCREEN -->
    <div id="lobbyScreen" class="screen">
      <h1>EggStein.exe</h1>

      <div class="card">
        <h2>Lobby</h2>
        <input id="roomIdInput" type="text" placeholder="ID stanza" />
        <button id="createBtn">Crea Stanza</button>
        <button id="joinBtn">Entra nella Stanza</button>
      </div>

      <div class="card">
        <h3>Stanze attive</h3>
        <ul id="roomList"></ul>
      </div>

      <p id="status"></p>
      <p id="messages"></p>
    </div>

    <!-- 🟩 ROOM SCREEN -->
    <div id="roomScreen" class="screen hidden">
      <h1>EggStein.exe</h1>

      <h2>Stanza: <span id="currentRoomName"></span></h2>
      <p id="roomStatus">In attesa di altri giocatori...</p>

      <button id="readyBtn">Ready</button>
      <button id="leaveRoomBtn">Abbandona Stanza</button>
    </div>

    <!-- 🟥 GAME SCREEN -->
    <div id="gameScreen" class="screen hidden"></div>

    <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.js"></script>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
